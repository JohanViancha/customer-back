name: Publish JAR as Artifact
on:
  repository_dispatch:
    types: [publish-jar]
jobs:
  publish-jar:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_NAME: 'ada_qartz-0.0.1-SNAPSHOT.jar'
    permissions :
      contents: write
      pull-requests: write
    steps:
      - name: Debug Payload
        run: |
          echo "Payload: ${{ github.event.client_payload.base_branch }}"

      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.client_payload.base_branch }}
          fetch-depth: 0

      - name: check last hashid 
        run: |
          git log -2

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-



      - name: Build with Maven
        run: |
          mvn clean test package -DskipTests --batch-mode --update-snapshots
          echo ls -R target/
          echo ls -la


      - name: Upload JAR as Artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v3
        with:
          name: artifactjar
          paths: $ {{ github.workspace }}/target/${{ env.ARTIFACT_NAME }}